<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | TerraWatch NER</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 50%, #0d2818 100%);
            min-height: 100vh;
        }
        .login-card {
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255, 255, 255, 0.96);
            border-radius: 16px;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center py-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">

            <!-- BRAND HEADER -->
            <div class="text-center text-white mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-success text-white rounded-circle p-3 mb-3 shadow">
                    <i class="bi bi-shield-fill-check fs-2"></i>
                </div>
                <h3 class="fw-bold mb-1">TerraWatch NER</h3>
                <span class="badge bg-success-subtle text-success border border-success-subtle mt-2">IMDAI Course Academic AI Prototype</span>
            </div>

            <!-- LOGIN CARD -->
            <div class="card login-card shadow-lg p-4 p-md-5">
                <h4 class="fw-bold text-dark mb-1">Sign In</h4>
                <p class="text-muted small mb-4">Access North Eastern Region early warning and landslide monitoring.</p>

                <div id="alertBox" class="alert alert-danger d-none py-2 px-3 small" role="alert"></div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                            <input type="email" id="emailInput" class="form-control" placeholder="name@terrawatch.in" required value="admin@terrawatch.in">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                            <input type="password" id="passwordInput" class="form-control" placeholder="Enter password" required value="admin123">
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                            <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
                        </div>
                        <a href="index.html" class="small text-decoration-none text-success">Guest Access &rarr;</a>
                    </div>

                    <button type="submit" id="submitBtn" class="btn btn-success w-100 py-2 fw-semibold shadow-sm">
                        <span id="btnSpinner" class="spinner-border spinner-border-sm me-2 d-none"></span>
                        Sign In to TerraWatch
                    </button>
                </form>

                <hr class="my-4">

                <!-- QUICK ROLE DEMO SWITCHER -->
                <div class="small fw-bold text-uppercase text-secondary mb-2 text-center">
                    Quick Role Access (Authorized Emergency Portals)
                </div>

                <div class="row g-2">
                    <div class="col-6">
                        <button type="button" class="btn btn-outline-dark btn-sm w-100 text-start p-2" onclick="quickLogin('admin@terrawatch.in', 'admin123', 'admin.html')">
                            <div class="fw-bold"><i class="bi bi-person-gear text-danger me-1"></i> Admin</div>
                            <small class="text-muted" style="font-size: 11px;">MDoNER Ops</small>
                        </button>
                    </div>
                    <div class="col-6">
                        <button type="button" class="btn btn-outline-dark btn-sm w-100 text-start p-2" onclick="quickLogin('disaster@terrawatch.in', 'disaster123', 'admin.html')">
                            <div class="fw-bold"><i class="bi bi-shield-exclamation text-warning me-1"></i> Official</div>
                            <small class="text-muted" style="font-size: 11px;">SDMA / NDRF</small>
                        </button>
                    </div>
                    <div class="col-6">
                        <button type="button" class="btn btn-outline-dark btn-sm w-100 text-start p-2" onclick="quickLogin('officer@terrawatch.in', 'officer123', 'report-issue.html')">
                            <div class="fw-bold"><i class="bi bi-clipboard2-check text-primary me-1"></i> Field Officer</div>
                            <small class="text-muted" style="font-size: 11px;">On-ground PWD</small>
                        </button>
                    </div>
                    <div class="col-6">
                        <button type="button" class="btn btn-outline-dark btn-sm w-100 text-start p-2" onclick="quickLogin('citizen@terrawatch.in', 'citizen123', 'index.html')">
                            <div class="fw-bold"><i class="bi bi-person text-success me-1"></i> Citizen</div>
                            <small class="text-muted" style="font-size: 11px;">NER Resident</small>
                        </button>
                    </div>
                </div>

            </div>

            <!-- FOOTER -->
            <div class="text-center text-white-50 small mt-4">
                &copy; 2026 TerraWatch NER &bull; IMDAI Course Academic Capstone Prototype.
            </div>

        </div>
    </div>
</div>

<script src="api.js"></script>
<script src="offline-sync.js"></script>
<script>
    const form = document.getElementById("loginForm");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const alertBox = document.getElementById("alertBox");
    const submitBtn = document.getElementById("submitBtn");
    const btnSpinner = document.getElementById("btnSpinner");

    const api = window.TerraWatchAPI || window.LandSafeAPI;

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        alertBox.classList.add("d-none");
        submitBtn.disabled = true;
        btnSpinner.classList.remove("d-none");

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        try {
            const res = await api.login(email, password);
            console.log("Login success:", res);
            const role = res.user ? res.user.role : "CITIZEN";
            if (role === "ADMIN") {
                window.location.href = "admin.html";
            } else if (role === "DISASTER_OFFICIAL") {
                window.location.href = "admin.html";
            } else if (role === "FIELD_OFFICER") {
                window.location.href = "report-issue.html";
            } else {
                window.location.href = "index.html";
            }
        } catch (err) {
            alertBox.textContent = err.message || "Invalid credentials. Please try again.";
            alertBox.classList.remove("d-none");
        } finally {
            submitBtn.disabled = false;
            btnSpinner.classList.add("d-none");
        }
    });

    async function quickLogin(email, password, targetUrl) {
        emailInput.value = email;
        passwordInput.value = password;
        alertBox.classList.add("d-none");
        submitBtn.disabled = true;
        btnSpinner.classList.remove("d-none");

        try {
            await api.login(email, password);
            window.location.href = targetUrl;
        } catch (e) {
            console.warn("Backend offline or auth failure, redirecting directly to demo page:", targetUrl);
            window.location.href = targetUrl;
        }
    }
</script>
</body>
</html>
